<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="bd-app-version" content="1.3.1" />
  <title>BD Dashboard</title>
  <script>
    let startupTheme = "light";
    const themeSchemes = { light: "light", dark: "dark", sand: "light", forest: "dark", midnight: "dark" };
    try {
      const savedTheme = localStorage.getItem("bd-dashboard-theme");
      if (Object.prototype.hasOwnProperty.call(themeSchemes, savedTheme)) startupTheme = savedTheme;
    } catch (_) {
      // Use Light when browser storage is unavailable.
    }
    document.documentElement.dataset.theme = startupTheme;
    document.documentElement.style.colorScheme = themeSchemes[startupTheme];
  </script>
  <link rel="stylesheet" href="/static/v1.3.1/styles/base.css" />
  <link rel="stylesheet" href="/static/v1.3.1/styles/layout.css" />
  <link rel="stylesheet" href="/static/v1.3.1/styles/auth.css" />
  <link rel="stylesheet" href="/static/v1.3.1/styles/balances.css" />
  <link rel="stylesheet" href="/static/v1.3.1/styles/totalBalances.css" />
  <link rel="stylesheet" href="/static/v1.3.1/styles/users.css" />
  <link rel="stylesheet" href="/static/v1.3.1/styles/expenses.css" />
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <script type="module" src="/static/v1.3.1/js/app.js"></script>
</body>
</html>
